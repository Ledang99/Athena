[project]
name = "project-athena"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "ebooklib>=0.20",
    "fastapi>=0.141.1",
    "pymupdf>=1.28.2",
    "uvicorn[standard]>=0.53.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
